--force-device-scale-factor=1
# --ozone-platform=wayland
--ozone-platform-hint=auto
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim
# Chromium crash workaround for Wayland color management on Hyprland - see https://github.com/hyprwm/Hyprland/issues/11957
# --disable-features=WaylandWpColorManagerV1
--password-store=gnome-libsecret
# Keep the HTTP cache in RAM: streaming video churned ~25 GB/day onto the SATA SSD
--disk-cache-dir=/tmp/chrome-cache
--disk-cache-size=1073741824
