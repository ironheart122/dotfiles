# Font size lives here, not in `config`, so `omarchy display text size` can't
# rewrite it. That command sed-replaces `^font-size = ` in ~/.config/ghostty/config
# to keep the terminal in lockstep with the shell font (terminal_pt = px * 0.75),
# which would drag this to 12pt at the 16px shell size. Keeping the key out of
# that file means the sed matches nothing and this value stands.
#
# To go back to the unified knob: delete this file, drop the `config-file` line
# from `config`, and put `font-size` back there.
font-size = 14
